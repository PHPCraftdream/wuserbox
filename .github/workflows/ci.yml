name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # wuserbox is Windows-only: it calls the Windows security APIs directly,
    # and the tests create real access control entries.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --config .github/golangci.yml ./...

      - name: Test
        run: go test ./...

      # The delete boundary is the one property this tool exists to provide,
      # and the tests for it skip where an integrity label cannot be written.
      # A skip is honest, but a skipped run reported as a green one is not:
      # this fails instead, so the boundary is never silently untested.
      - name: Delete boundary
        shell: bash
        run: |
          output=$(go test ./internal/e2e/... ./internal/win/acl/... -count=1 -v \
            -run 'TestDeletingOutsideTheBoundaryIsRefused|TestASweepStopsAtTheBoundary|TestTheSandboxKeepsItsOwnWrites|TestReadingIsStillUnrestricted|TestSetWritableLabelsWhereItCan' 2>&1)
          echo "$output"
          if echo "$output" | grep -q -- "--- SKIP"; then
            echo "::error::the delete boundary was not covered: these tests need the rights to write an integrity label"
            exit 1
          fi
