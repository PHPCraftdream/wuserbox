name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # wuserbox is Windows-only: it calls the Windows security APIs directly,
    # and the tests create real access control entries.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The version the project declares, not whatever is newest today.
          # "stable" moved the toolchain underneath the build without anything
          # saying so, which is the wrong thing to discover while reading a
          # crash report.
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --config .github/golangci.yml ./...

      - name: Test
        run: go test ./...

      # The delete boundary is the one property this tool exists to provide.
      # The tests for it need no administrator rights -- an access control
      # entry only needs ownership of the object it is set on -- so they run
      # unconditionally as part of the step above rather than skipping where
      # elevation is missing, the way the integrity-label era's tests did.
      #
      # A skip is honest, but a skipped run reported as a green one is not:
      # this fails instead, so the boundary is never silently untested.
      - name: Delete boundary
        shell: bash
        run: |
          # Named one by one on purpose. Running the whole package and failing
          # on any skip would be shorter and wrong: two tests in it skip for
          # honest reasons about the machine they find, and a check that turns
          # red for those teaches people to ignore it. Every name here is a
          # claim that this one can always be answered, anywhere.
          names='TestDeletingOutsideTheBoundaryIsRefused|TestASweepStopsAtTheBoundary|TestTheSandboxKeepsItsOwnWrites|TestReadingIsStillUnrestricted|TestOneSandboxCannotDeleteAnothersFiles|TestAProtectedFileInsideAGrantedDirectorySurvives|TestOneSandboxCannotReachWhatADirectoryAboveHandedDown|TestPeerCannotReachAnEntryASubdirectoryHoldsItself|TestRevokingReachesWhatANestedGrantPinned|TestRepairingAnInterruptedNarrowingReachesWhatANestedGrantPinned|TestASandboxCannotRewriteThePermissionsItWasLeft|TestNarrowingNeverHandsOutReading|TestHomeTopHoldsWhereTheMachineHandsOutNothing|TestAGrantThatCannotFinishGrantsNothing|TestAGrantThatCannotFinishChangesNothingAtAll|TestAnObjectWithNoListAtAllIsNarrowedToo|TestAnAuditSeesWhatWasHandedDown|TestASweepDoesNotCostTheOwnerTheirOwnWrite|TestAGrantDoesNotReachThroughAJunction|TestGrantingADirectoryWithNoListKeepsItsOwner|TestAProtectedObjectInsideAGrantedTreeStaysProtected|TestAGrantRefusesAFileWithASecondNameOutside|TestAllowLinksHandsTheTreeOverAnyway|TestAGrantAllowsALinkThatStaysInsideTheTree|TestALinkInsideATreeNamedInShortFormIsStillInside|TestAGrantTakesWriteFromAuthenticatedUsersToo'
          output=$(go test ./internal/e2e/... ./internal/win/acl/... -count=1 -v -run "$names" 2>&1)
          echo "$output"
          if echo "$output" | grep -q -- "--- SKIP"; then
            echo "::error::the boundary was not covered: a test that should never skip did"
            exit 1
          fi
          # A name that no longer matches anything passes the check above in
          # silence: nothing skipped, because nothing ran. Counting is what
          # tells a renamed test from a covered one.
          wanted=$(echo "$names" | tr '|' '\n' | grep -c .)
          passed=$(echo "$output" | grep -c -- "--- PASS")
          if [ "$passed" -ne "$wanted" ]; then
            echo "::error::$passed of $wanted boundary tests ran; a name in the list matches nothing"
            exit 1
          fi
