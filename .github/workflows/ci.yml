name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # wuserbox is Windows-only: it calls the Windows security APIs directly,
    # and the tests create real access control entries.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The version the project declares, not whatever is newest today.
          # "stable" moved the toolchain underneath the build without anything
          # saying so, which is the wrong thing to discover while reading a
          # crash report.
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --config .github/golangci.yml ./...

      - name: Test
        run: go test ./...

      # The delete boundary is the one property this tool exists to provide.
      # The tests for it need no administrator rights -- an access control
      # entry only needs ownership of the object it is set on -- so they run
      # unconditionally as part of the step above rather than skipping where
      # elevation is missing, the way the integrity-label era's tests did.
      #
      # A skip is honest, but a skipped run reported as a green one is not:
      # this fails instead, so the boundary is never silently untested.
      - name: Delete boundary
        shell: bash
        run: |
          # Named one by one on purpose. Running the whole package and failing
          # on any skip would be shorter and wrong: two tests in it skip for
          # honest reasons about the machine they find, and a check that turns
          # red for those teaches people to ignore it. Every name here is a
          # claim that this one can always be answered here.
          #
          # "Here" and not "anywhere", since the account tests were added: those
          # build real local accounts and need administrator rights, which a
          # runner always has and a desk usually does not. They are on this
          # list because they are the only tests that measure the boundary on
          # the mechanism a real run uses -- the rest go through the older
          # restricted token, where an entry naming something the token does
          # not carry reaches nobody, so they cannot tell a permission taken
          # away from one that was never reachable. Running them anywhere but
          # CI means reading the skip and knowing why.
          #
          # The owner-cap tests are here because the boundary they measure is
          # one Windows hands back for free: an owner holds WRITE_DAC whether
          # the list says so or not, so before the cap a sandbox could rewrite
          # the permissions of anything it had created and undo a narrowing
          # from inside. Four of them run unelevated and are the real guard on
          # the mechanism; the fifth and sixth pin what must NOT change -- an
          # object the operator owns, and an object somebody sealed -- because
          # a cap that widens its scope by one line reaches the operator's own
          # files. The e2e one is the only one that measures it through a real
          # sandbox account, which is the only place the owner and the writer
          # of the list are genuinely two identities.
          #
          # The lease tests are here for a sharper reason than coverage:
          # they are the only measurement that the slot is taken by the command
          # that owns a run, and before it touches the profile two runs share.
          # The stub test above them takes its lease itself, from the test, so
          # it would go on passing if a run stopped taking one at all -- these
          # four are what would not.
          names='TestDeletingOutsideTheBoundaryIsRefused|TestASweepStopsAtTheBoundary|TestTheSandboxKeepsItsOwnWrites|TestReadingIsStillUnrestricted|TestOneSandboxCannotDeleteAnothersFiles|TestAProtectedFileInsideAGrantedDirectorySurvives|TestOneSandboxCannotReachWhatADirectoryAboveHandedDown|TestPeerCannotReachAnEntryASubdirectoryHoldsItself|TestRevokingReachesWhatANestedGrantPinned|TestRepairingAnInterruptedNarrowingReachesWhatANestedGrantPinned|TestASandboxCannotRewriteThePermissionsItWasLeft|TestNarrowingNeverHandsOutReading|TestHomeTopHoldsWhereTheMachineHandsOutNothing|TestAGrantThatCannotFinishGrantsNothing|TestAGrantThatCannotFinishChangesNothingAtAll|TestAnObjectWithNoListAtAllIsNarrowedToo|TestAnAuditSeesWhatWasHandedDown|TestEveryoneWritableSeesWriteBesideAPartialDeleteDeny|TestASweepDoesNotCostTheOwnerTheirOwnWrite|TestAGrantDoesNotReachThroughAJunction|TestGrantingADirectoryWithNoListKeepsItsOwner|TestAProtectedObjectInsideAGrantedTreeStaysProtected|TestAGrantRefusesAFileWithASecondNameOutside|TestAGrantRefusesAHardLinkAcrossFilesystemDistinctUnicodeDirectories|TestAllowLinksHandsTheTreeOverAnyway|TestAGrantAllowsALinkThatStaysInsideTheTree|TestALinkInsideATreeNamedInShortFormIsStillInside|TestAGrantTakesWriteFromAuthenticatedUsersToo|TestTwoRealAccountsCannotReachEachOther|TestAGrantTakesAuthenticatedUsersAwayFromEveryOtherAccount|TestAShellStartsUnderTheAccountsOwnRestrictedToken|TestTheRestrictedTokenClosesWhatTheAccountAloneCannot|TestTheExitCodeComesBackFromInsideTheSandbox|TestTheStreamsComeBackFromInsideTheSandbox|TestCheckAnswersWithTheTokenARunGets|TestASecondStubIsNotBornWhileAProgramOfTheSandboxRuns|TestARunRefusedByTheSlotLeavesTheProfileAlone|TestInitProbesTheStubWhileHoldingTheLeaseItself|TestRmIsRefusedWhileAnotherRunHoldsTheSlot|TestInitIsRefusedWhileAnotherRunHoldsTheSlot|TestMakingAProfileDoesNotReachThroughAJunction|TestTheProgramCannotTurnOnTheProcessThatConfinedIt|TestCopyRefusesARecordedNameThatClimbsOutOfTheProfile|TestCopyCannotBeWalkedOutOfTheProfileThroughAJunction|TestCopyCanStillClearAJunctionTheSandboxLeftBehind|TestCleanupCannotReachOutOfTheProfileThroughAJunction|TestAReadOnlyHandoverHoldsOnTheSecondEntry|TestIsolateCapsWhatTheOwnerOfAFileHoldsImplicitly|TestTakingBackRepairsAnExtraOwnerRightsGrant|TestIsolateRepairsAnExtraTrusteeOnAnAlreadyCappedOwnedChild|TestASweepReachesWhatItWroteWhenTheGrantNarrows|TestASealedObjectTheRecordHoldsIsLeftAlone|TestWithoutTheRecordASweepReachesWhatTheSandboxSealed|TestAWritableGrantKeepsWorkingUnderTheCap|TestIsolateLeavesAnObjectTheOperatorOwnsAlone|TestIsolateRefusesAnAccountItCannotResolve|TestTheIdentitiesFailClosedWhenTheAccountIsNotSIDText|TestTheIdentitiesOfAnAccountThatNamesNoGroupAreItself|TestWhatTheSandboxOwnsStaysLockedAfterTheGrantIsGone|TestADirectRevokeCapsAFileTheSandboxOwnsWithNoNarrowingFirst|TestARevokeReachesAnObjectTheSandboxGaveItselfADACL|TestNameKeepsFilesystemDistinctUnicodeDirectoriesApart'
          # Five packages, because the boundary stopped being one package's
          # business: a sandbox is kept out of the machine's files by acl and
          # e2e, out of the profile it is handed by account, out of steering
          # what fills or clears that profile by profile -- copying and
          # cleanup both run with the operator's own rights, and a junction
          # the sandbox plants in its own profile must not walk either one
          # out of it -- and out of the process that confined it by proc. A
          # fix of that size with a guard nobody runs is a fix nobody has.
          # The status is taken rather than left to -e, and the output is
          # printed before anything is decided about it. Letting the shell end
          # the step on a failing go test took the log with it: a run that
          # failed here printed the step's own header and nothing else, so the
          # one thing the step exists to report -- which test, and how -- was
          # the one thing missing from it.
          failed=0
          output=$(go test ./internal/e2e/... ./internal/win/acl/... ./internal/account/... ./internal/policy/profile/... ./internal/win/proc/... ./internal/sandbox/... \
            -count=1 -v -run "$names" 2>&1) || failed=$?
          echo "$output"
          if [ "$failed" -ne 0 ]; then
            echo "::error::a boundary test failed"
            exit "$failed"
          fi
          if echo "$output" | grep -q -- "--- SKIP"; then
            echo "::error::the boundary was not covered: a test that should never skip did"
            exit 1
          fi
          # A name that no longer matches anything passes the check above in
          # silence: nothing skipped, because nothing ran. Counting is what
          # tells a renamed test from a covered one.
          wanted=$(echo "$names" | tr '|' '\n' | grep -c .)
          passed=$(echo "$output" | grep -c -- "--- PASS")
          if [ "$passed" -ne "$wanted" ]; then
            echo "::error::$passed of $wanted boundary tests ran; a name in the list matches nothing"
            exit 1
          fi

      - name: Registry hive picture
        shell: bash
        run: |
          # The one measurement in this repository whose value is its output
          # rather than its verdict. TestWhatTheSeededHiveAnswersItsOwnAccount
          # asserts the shape the fix of 2026-09-17 landed: the permission
          # list on the seeded root reaches the subkeys, so the account's own
          # logons are answered everywhere in its hive -- the root, a fresh
          # subkey of it, HKCU\Software for reading as much as for writing,
          # and HKCU\Software\Classes, which is UsrClass.dat rather than the
          # seeded hive at all -- and it reports who owns each key and what
          # each permission list grants. go test prints that report only
          # under -v, so this step exists to put it in the log of every run
          # rather than only in the log of a failing one. It needs the
          # administrator rights a runner has and a desk usually does not, so
          # here is the only place it ever runs.
          #
          # This step ran first on the defect, and the refusal it logged then
          # is quoted in docs/investigations/a-hive-per-slot.md beside the two
          # permission lists that explained it. Three of the assertions below
          # measured that refusal until the fix turned them around.
          #
          # It is still written to go red when the picture moves again. That
          # is the wanted signal, not a breakage: the investigation and
          # docs/limits.md are corrected in the same change that moves it.
          if ! output=$(go test ./internal/account/ -run TestWhatTheSeededHiveAnswersItsOwnAccount -count=1 -v); then
            echo "$output"
            echo "::error::the registry hive measurement failed"
            exit 1
          fi
          echo "$output"
          if echo "$output" | grep -q -- "--- SKIP"; then
            echo "::error::the registry hive measurement was skipped"
            exit 1
          fi
          if ! echo "$output" | grep -q -- "--- PASS: TestWhatTheSeededHiveAnswersItsOwnAccount"; then
            echo "::error::the registry hive measurement did not pass"
            exit 1
          fi
