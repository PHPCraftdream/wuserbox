# Release build for wuserbox. Invoked from .github/workflows/release.yml:
#   goreleaser release --clean --config .github/goreleaser.yaml
version: 2

project_name: wuserbox

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: wuserbox
    main: ./cmd/wuserbox
    binary: wuserbox
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/PHPCraftdream/wuserbox/internal/cli/inspect.Release={{ .Version }}

archives:
  - id: wuserbox
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_windows_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      # The configuration parser needs this library. Shipping it beside the
      # executable keeps the first run working without network access; the
      # workflow downloads it before the archives are built.
      - src: .ktav/ktav_cabi-windows-{{ .Arch }}.dll
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Installing

    ```
    scoop bucket add wuserbox https://github.com/PHPCraftdream/scoop-bucket
    scoop install wuserbox
    ```

    ```
    npm install -g wuserbox
    ```

    Or download the archive below and put `wuserbox.exe` on your PATH.

# The manifest is pushed to a bucket repository, which Scoop users add once.
scoops:
    # Written either way, and pushed only where there is a token to push with.
    # Without this a tag cut before the bucket exists fails here, after the
    # archives are already published: a release nobody can install and a red
    # build that says nothing about which half of it worked. The manifest still
    # lands in dist/, so it can be copied into the bucket by hand.
  - skip_upload: '{{ if .Env.BUCKET_TOKEN }}false{{ else }}true{{ end }}'
    repository:
      owner: PHPCraftdream
      name: scoop-bucket
      branch: main
      token: "{{ .Env.BUCKET_TOKEN }}"
    directory: bucket
    homepage: https://github.com/PHPCraftdream/wuserbox
    description: Run commands on Windows under a separate account with writes limited to permitted directories
    license: MIT OR Apache-2.0
    commit_author:
      name: goreleaser
      email: noreply@github.com
